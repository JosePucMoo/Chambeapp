[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy declarative models resuelven las relaciones por nombre en tiempo de
# ejecución (forward references en cadenas), por lo que no están importadas.
"infrastructure/db/models/*" = ["F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
